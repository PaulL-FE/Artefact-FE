services:
  frontend:
    image: nginx:alpine
    container_name: artefact-fe-prod
    restart: always
    environment:
      - SERVER_NAME=art-fact.ai
    ports:
      # adorCV already binds 80/443 on this same Hetzner box, and per Vlad's
      # plan a host-level nginx will terminate TLS for both sites and proxy
      # plain HTTP to each container's own port — so this container only
      # needs to expose plain HTTP internally, on a non-standard host port.
      - "8081:80"
    volumes:
      # Jenkins scp's the compiled static files + nginx.conf.template here on
      # every deploy (see Jenkinsfile 'Transfer to Server' stage).
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf.template:/tmp/nginx.conf.template:ro
    command: >
      sh -c "envsubst '$$SERVER_NAME' < /tmp/nginx.conf.template > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
